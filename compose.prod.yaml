services:
  backend:
    build:
      target: prod

  frontend:
    build:
      target: runner


  redis:
    build:
      context: ./_docker/redis
      dockerfile: Dockerfile

    container_name: redis4${PROJECT_NAME}

    restart: unless-stopped
    
  nginx:
    build:
      target: prod

    ports:
      - "443:443"

    volumes:
      - ./_docker/nginx/certbot/www:/var/www/certbot:ro
      - ./_docker/nginx/certbot/conf:/etc/letsencrypt:ro


  certbot:
    image: certbot/certbot:latest

    container_name: certbot4${PROJECT_NAME}

    volumes:
      - ./_docker/nginx/certbot/www:/var/www/certbot
      - ./_docker/nginx/certbot/conf:/etc/letsencrypt

    restart: unless-stopped