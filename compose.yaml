services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    
    container_name: backend4${PROJECT_NAME}

    restart: unless-stopped

    env_file:
      - .env

  frontend:
    
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
     
    container_name: frontend${PROJECT_NAME}
    
    restart: unless-stopped

    env_file:
      - .env

  nginx:
    build:
      context: ./_docker/nginx
      dockerfile: Dockerfile
    
    container_name: nginx4${PROJECT_NAME}

    restart: unless-stopped


    ports:
      - "80:80"

    volumes:
      - ./_docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend
      - frontend