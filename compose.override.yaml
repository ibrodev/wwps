services:
  backend:
    build:
      target: dev

    ports:
      - "8000:8000"

    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore: 
            - .venv/

        - action: rebuild
          path: ./backend/pyproject.toml
        
        - action: rebuild
          path: ./backend/uv.lock

  frontend:
    build:
      target: dev

    ports:
      - "3000:3000"
    
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/

        - action: rebuild
          path: ./frontend/package.json
